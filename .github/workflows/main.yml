name: GitHub Actions AWS Test

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  aws-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Debug - Raw STS Call
        run: |
          # Get the OIDC token from GitHub
          OIDC_TOKEN=$(curl -s \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')
          
          echo "Token length: ${#OIDC_TOKEN}"
          
          # Decode the sub claim from the token
          echo "=== Token Claims ==="
          echo $OIDC_TOKEN | cut -d'.' -f2 | base64 -d 2>/dev/null | jq '{sub, aud, iss}'
          
          # Try raw STS call and capture full error
          echo "=== STS Response ==="
          aws sts assume-role-with-web-identity \
            --role-arn arn:aws:iam::441931764410:role/neuraltalk-dev-eks-deployment-role \
            --role-session-name test-session \
            --web-identity-token "$OIDC_TOKEN" \
            --region us-east-1 2>&1 || true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::441931764410:role/neuraltalk-dev-eks-deployment-role
          aws-region: us-east-1

      - name: Check AWS identity
        run: |
          aws sts get-caller-identity
