name: OIDC Debug

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Print OIDC token claims
        run: |
          echo "Requesting OIDC token with audience=sts.amazonaws.com ..."
          TOKEN=$(curl -sS \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=sts.amazonaws.com" | jq -r '.value')

          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "ERROR: No token returned. Is 'id-token: write' permission set?"
            exit 1
          fi

          echo "=== Full decoded claims ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | jq '.'

          echo ""
          echo "=== Key fields to match in the IAM trust policy ==="
          echo "$TOKEN" | cut -d. -f2 | base64 -d 2>/dev/null | \
            jq '{iss, aud, sub, repository, repository_owner, ref, workflow_ref}'
